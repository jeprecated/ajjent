name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Install tested jj
        shell: bash
        run: |
          set -euo pipefail
          # noCleanup verifies an exact version-specific operation sequence.
          # Keep equal to the source default in internal/buildcfg.
          jj_version=0.43.0
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) target=x86_64-unknown-linux-musl ;;
            Linux-aarch64|Linux-arm64) target=aarch64-unknown-linux-musl ;;
            Darwin-x86_64) target=x86_64-apple-darwin ;;
            Darwin-arm64) target=aarch64-apple-darwin ;;
            *) echo "unsupported runner: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          curl -L --fail -o jj.tar.gz "https://github.com/jj-vcs/jj/releases/download/v${jj_version}/jj-v${jj_version}-${target}.tar.gz"
          mkdir -p jj-dist
          tar -xzf jj.tar.gz -C jj-dist
          jj_bin="$(find jj-dist -type f -name jj -perm -u+x | head -n 1)"
          test -n "$jj_bin"
          mkdir -p "$RUNNER_TEMP/ajj-test-bin"
          install -m 0755 "$jj_bin" "$RUNNER_TEMP/ajj-test-bin/jj"
          echo "$RUNNER_TEMP/ajj-test-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ajj-test-bin/jj" --version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -l cmd/ajj | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out

      - name: Test
        run: go test -timeout 20m ./...
